name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsage
          POSTGRES_PASSWORD: docsage
          POSTGRES_DB: docsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsage -d docsage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DOCSAGE_TEST_DATABASE_URL: postgresql://docsage:docsage@localhost:5432/docsage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[postgres,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

      - name: Retrieval eval gate
        run: python evals/run_evals.py -k 3 --min-hit-rate 0.9 --min-mrr 0.8
